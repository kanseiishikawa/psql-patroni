global
    maxconn 500

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m

# --- アプリケーションからの接続受付窓口 ---
frontend pg_cluster_front
    bind *:5432
    default_backend pg_cluster_back

# --- バックエンドのPatroni（PostgreSQL）3台の定義 ---
backend pg_cluster_back
    mode tcp
    # Patroniの/primaryエンドポイントをHTTPチェック
    option httpchk GET /primary
    http-check expect status 200
    
    # 接続が切り替わった際、古いノードへのセッションを即座に切断する設定
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    # ※コンテナ名やポート番号は、ご自身の既存環境に合わせて修正してください
    server pg-node-1 172.20.0.11:5432 maxconn 500 check port 8008
    server pg-node-2 172.20.0.12:5432 maxconn 500 check port 8008
    server pg-node-3 172.20.0.13:5432 maxconn 500 check port 8008
