# 🔌 接続設定
listen_addresses = '*'          # すべてのインターフェースからの接続を許可
port = 5432
max_connections = 100

# 🧠 メモリ設定（コンテナの環境に合わせて適宜調整）
shared_buffers = 128MB
dynamic_shared_memory_type = posix

# 🔄 WAL & 論理レプリケーション設定（移行に必須）
wal_level = logical             # 👈 これが論理レプリケーションに必須です
max_wal_senders = 10            # Patroniや確認用接続のための送信枠
max_replication_slots = 10       # パブリケーション用のスロット上限数

# ログ設定（コンテナログで見やすいように設定）
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '

# 🌐 ロケールとエンコーディング
datestyle = 'iso, ymd'
timezone = 'Asia/Tokyo'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'